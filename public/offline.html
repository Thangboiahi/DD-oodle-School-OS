<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — DD-oodle School OS</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0b1120;
          color: #f8fafc;
        }
        main {
          background-color: #111827;
          border-color: #1f2937;
        }
        p {
          color: #94a3b8;
        }
      }
      main {
        max-width: 28rem;
        width: 100%;
        padding: 1.5rem;
        border-radius: 0.75rem;
        border: 1px solid #e2e8f0;
        background-color: #ffffff;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        line-height: 1.4;
      }
      p {
        margin: 0 0 1rem;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #475569;
      }
      a {
        display: inline-block;
        padding: 0.625rem 1rem;
        border-radius: 0.375rem;
        background-color: #1d4ed8;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are currently offline</h1>
      <p>
        DD-oodle requires an active network connection for authoritative and
        sensitive school operations (such as attendance approvals, fee
        transactions, results, and restricted documents).
      </p>
      <a href="/">Retry connection</a>
    </main>
  </body>
</html>
